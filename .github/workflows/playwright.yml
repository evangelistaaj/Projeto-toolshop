# Integração contínua: corre os cenários contra o site público, nos 3 browsers,
# e publica o relatório HTML.
name: Testes E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite correr à mão, no separador Actions

# Uma execução de cada vez por ramo: um push novo cancela a que estiver a correr.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Obter o projeto de testes
        uses: actions/checkout@v6

      - name: Instalar o Node.js (versão do .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Verificar os tipos (TypeScript)
        run: npm run typecheck

      # Normalmente leva cerca de 1 minuto. Se um mirror de pacotes encravar (já aconteceu:
      # mais de 20 minutos parado), o passo falha aos 10 minutos em vez de esperar pelos 60 do job.
      - name: Instalar os browsers do Playwright
        run: npx playwright install --with-deps
        timeout-minutes: 10

      - name: Correr os cenários
        run: npm test

      - name: Publicar o relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # O relatório também fica no GitHub Pages (só nos pushes para main).
      - name: Enviar o relatório para o GitHub Pages
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

  # Publica o relatório no GitHub Pages, mesmo quando há falhas (é quando mais interessa).
  publicar:
    needs: testes
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.testes.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
